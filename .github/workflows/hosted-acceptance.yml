name: Synthetic hosted acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: synthetic-hosted-acceptance
  cancel-in-progress: false

jobs:
  manual-package-checkpoint:
    name: Synthetic manual package and checkpoint
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Check dependency-free acceptance helpers (no runtime)
        run: >-
          python3 -m unittest discover -s tests
          -p test_hosted_acceptance.py -v

      - name: Run disconnected synthetic A to B to matching A checkpoint
        run: python3 -m scripts.hosted_acceptance

      - name: Upload only sanitized public evidence
        if: always()
        # actions/upload-artifact v7
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: synthetic-hosted-acceptance
          path: hosted-evidence/report.json
          if-no-files-found: error
          retention-days: 7
